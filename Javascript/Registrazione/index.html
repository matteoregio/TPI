<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <title>Document</title>
</head>
<body>
    <h1>Iscrizione al corso</h1>

    <form id="formIscrizione">
        <label for="Nome">Nome:</label>
        <input type="text" id="Nome" name="Nome">

        <br><br>
        <label for="Email">Email:</label>
        <input type="text" id="Email" name="Email">

        <br><br>
        <label for="Data">Data del feedback:</label>
        <input type="date" id="Data" name="Data">

        <br><br>
        <label for="Selezione">Scegli il corso:</label>
        <select id="Selezione" name="Selezione">
            <option value="corso1">Maggio - Karate</option>
            <option value="corso2">Giugno e Luglio - Ginnastica artistica</option>
            <option value="corso3">Agosto - Basket</option>
            <option value="corso4">Settembre - Tennis</option>
        </select>

        <br><br>
        <label for="Messagio">Messaggio:</label>
        <textarea name="Messaggio" rows="10" cols="10"></textarea>
        
        <br><br>
        <label for="Check">Iscriviti alla Newsletter</label>
        <input type="checkbox" id="Check" name="Check">
        
        <br><br>

        <button type="submit">Invia</button>
    </form>

    <p id="messaggio"></p>

    <table border = "1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Data</th>
                <th>Tipo</th>
                <th>Messaggio</th>
                <th>Newsletter</th>
                <th>Azione</th>
            </tr>
        </thead>

        <tbody id="tabellaFeedback"></tbody>

    </table>

    
</body>
</html>
